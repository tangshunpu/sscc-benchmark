[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sscc-benchmark"
version = "0.1.0"
description = "Reproducible image source coding + 5G LDPC/QAM/AWGN benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "SSCC Benchmark contributors"}]
dependencies = ["numpy>=1.26,<3", "pillow>=10", "torch>=2.9.1,<3", "tqdm>=4.66"]

[project.optional-dependencies]
channel = ["sionna==2.0.1"]
metrics = ["pytorch-msssim>=1.0", "torch-fidelity>=0.3", "pyiqa>=0.1.15"]
learned = ["numpy<2", "compressai==1.2.8", "fvcore>=0.1.5", "timm>=0.9", "thop>=0.1.1", "ptflops>=0.7", "torchvision", "lpips>=0.1.4"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.11"]

[project.scripts]
sscc-prepare = "sscc.cli.prepare:main"
sscc-benchmark = "sscc.cli.benchmark:main"
sscc-suite = "sscc.cli.suite:main"
sscc-summarize = "sscc.cli.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real LDPC or external codec execution"]

[tool.uv]
conflicts = [[{extra = "channel"}, {extra = "learned"}], [{extra = "metrics"}, {extra = "learned"}]]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
